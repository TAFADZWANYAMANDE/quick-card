ssages. The app renders a personalised card with that guest’s name, prepares an official wa.me chat link with your greeting, and lets you tap Send in WhatsApp. You retain complete control over every single message.`},{question:`How does phone number cleaning work for Zimbabwe mobile networks?`,answer:`You can paste numbers in any common local format: 0771234567, 078..., 071..., 073..., or with spaces and dashes. QuickCard automatically strips symbols, adds the international Zimbabwe country code +263, and flags invalid digit counts before you start sending.`},{question:`Can I type cards in Shona, Ndebele, or other languages?`,answer:`Yes, absolutely. The card editor accepts any text you type, including Shona, Ndebele, English, and Portuguese. Diacritics and apostrophes are rendered crisply using our bundled open-license fonts.`},{question:`What is the “Made with QuickCard” tag and how is it removed?`,answer:`Free cards include a tiny, elegant “Made with QuickCard” mark in the bottom corner. A one-time $2 USD (or EcoCash equivalent) unlock code removes the tag permanently and expands your personalised recipient limit to 100 people per send.`},{question:`How does an offline unlock code work without a server?`,answer:`QuickCard uses Ed25519 digital signature cryptography. When you purchase an unlock, the seller signs your phone’s unique Device ID using their private key on an offline laptop. When you paste that code into QuickCard, the app checks the signature with its bundled public key offline. No server or internet connection is required to verify your license.`},{question:`How do auto-calculating tables work for Savings Groups (Mukando)?`,answer:`Templates like the Contributions Record and Grocery List feature dynamic table rows. As you type amounts for each member (e.g., $50 for Mai Nyasha, $50 for Baba Munashe), QuickCard automatically sums the total and paints a neat, tamper-resistant financial summary card.`}],bt=()=>{let[e,t]=(0,v.useState)(0);return(0,H.jsxDE
